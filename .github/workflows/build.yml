name: build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run test workflow
    uses: ./.github/workflows/test.yml
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          check-latest: true
      - name: Install dependencies
        run: python -m pip install --upgrade pip tox
      - name: Build sdist
        run: tox
        env:
          TOXENV: sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
  wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          check-latest: true
      - name: Install dependencies
        run: python -m pip install --upgrade pip tox
      - name: Build wheel
        run: tox
        env:
          TOXENV: wheel
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
