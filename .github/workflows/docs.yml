name: api docs

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          check-latest: true
      - name: Install dependencies
        run: python -m pip install --upgrade pip tox
      - name: Build API docs
        run: tox
        env:
          TOXENV: docs
      - name: Publish API docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/docs
      - name: Show published URL
        run: |
          echo "Published API docs URL: https://coreygoldberg.com/xvfbwrapper"
          echo "GitHub commit: https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}"
