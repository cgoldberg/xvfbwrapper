# Tox configuration - environment and task orchestrator
#
# Environments are isolated and managed by uv using uv.lock.
#
# Run "tox" from this directory.
#
# Run a specific environment with:
#   "tox -e <env>" (e.g. "tox -e lint")


[tox]
requires = tox-uv
venv_redirect = false
env_list =
    lint
    type
    validate
    py311
    py315
skip_missing_interpreters = true


[testenv]
runner = uv-venv-lock-runner
base_python = python3.13
platform = linux|darwin|.*bsd.*
fail_fast = true
dependency_groups = test
commands =
    pytest {posargs:.}


[testenv:py311]
description = Run tests with Python 3.11
base_python = python3.11


[testenv:py312]
description = Run tests with Python 3.12
base_python = python3.12


[testenv:py313]
description = Run tests with Python 3.13
base_python = python3.13


[testenv:py314]
description = Run tests with Python 3.14
base_python = python3.14


[testenv:py315]
description = Run tests with Python 3.15
base_python = python3.15


[testenv:pypy3]
description = Run tests with PyPy
base_python = pypy3


[testenv:lint]
description = Run linting and formatting
package = skip
dependency_groups = lint
commands =
    ruff check --fix --show-fixes --exit-non-zero-on-fix .
    ruff format --exit-non-zero-on-format .


[testenv:validate]
description = Validate build and project configuration
dependency_groups = validate
commands =
    uv lock --check
    validate-pyproject pyproject.toml
    {envpython} -c "import xvfbwrapper"


[testenv:type]
description = Run type checking
dependency_groups = type
package = skip
commands =
    mypy --install-types --non-interactive {posargs:.}


[testenv:lock]
description = Update dependency lockfile
runner = uv-venv-runner
package = skip
commands =
    uv lock --upgrade


[testenv:sdist]
description = Build source distribution
package = skip
commands =
    {env_python} -c "import shutil; shutil.rmtree(r'{tox_root}/dist', ignore_errors=True)"
    uv build --sdist
    uvx twine check --strict dist/*


[testenv:wheel]
description = Build wheel
package = skip
commands =
    {env_python} -c "import shutil; shutil.rmtree(r'{tox_root}/dist', ignore_errors=True)"
    uv build --wheel
    uvx twine check --strict dist/*


[testenv:check-dist]
description = Validate built distributions
base_python = python3.15
package = skip
depends =
    sdist
    wheel
commands =
    uvx twine check --strict dist/*


[testenv:docs]
description = build docs
base_python = python3.15
allowlist_externals = echo
dependency_groups = docs
commands =
    echo "Cleaning {tox_root}/build/"
    {envpython} -c "import shutil; shutil.rmtree('build', ignore_errors=True)"
    echo "Building docs..."
    {envpython} -m pdoc xvfbwrapper \
        --output-dir build/docs \
        --template-directory docs/pdoc \
        --no-search \
        --docformat markdown
    echo "Docs successfully built: {tox_root}/build/docs/index.html"
