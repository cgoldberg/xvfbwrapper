[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xvfbwrapper"
version = "0.2.37"
description = "Manage headless displays with Xvfb (X virtual framebuffer)"
requires-python = ">= 3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Corey Goldberg"}]
maintainers = [{name = "Corey Goldberg"}]
readme = "README.md"
keywords = ["Xvfb", "headless", "display", "X11", "X Window System"]
classifiers = [
        "Environment :: Console",
        "Environment :: X11 Applications",
        "Intended Audience :: Developers",
        "Intended Audience :: Information Technology",
        "Operating System :: POSIX",
        "Operating System :: POSIX :: Linux",
        "Operating System :: Unix",
        "Programming Language :: Python",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: 3.15",
        "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
homepage = "https://github.com/cgoldberg/xvfbwrapper"
repository = "https://github.com/cgoldberg/xvfbwrapper"
documentation = "https://coreygoldberg.com/xvfbwrapper"

[dependency-groups]
dev = [
    "tox",
]
docs = [
    "pdoc==16.0.0",
]
lint = [
    "ruff==0.17.2",
]
test = [
    "psutil==7.2.2",
    "pytest==9.1.1",
]
type = [
    "mypy==2.4.0",
    "types-psutil==7.2.2.20260906",
]
validate = [
    "validate-pyproject[all]==0.27",
]

[tool.setuptools]
py-modules = ["xvfbwrapper"]

[tool.pytest]
addopts = ["-v"]
filterwarnings = ["default"]
tmp_path_retention_policy = "none"

[tool.ruff]
line-length = 88
respect-gitignore = true
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "COM812", "D", "EM101", "EM102", "FBT",
    "PERF203", "PLR", "PT", "PYI034", "SLF001",
    "S101", "S108", "S311", "S603", "TRY003",
    "TRY400"
]
fixable = ["ALL"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88
